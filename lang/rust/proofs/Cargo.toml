[package]
workspace = "../native"
name = "dilf4s-proofs"
description = "dilf4s proof verifiers: Merkle trees, binary tries, versioned tries, Poseidon and its Merkle tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dilf4s-core = { path = "../core" }
ark-bn254 = { version = "0.6", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.6", default-features = false }
# BN254 groups and the pairing (EIP-196/197), at the version SP1 patches (issue #19). Not substrate-bn-succinct-rs, the
# patch as published on crates.io: off the zkVM it multiplies by schoolbook and long division rather than Montgomery,
# which made the zk vectors 34x slower natively (issue #67). The SP1 guest patches this crate to the same source.
bn = { package = "substrate-bn", version = "=0.6.0", default-features = false }
num-bigint.workspace = true
num-traits.workspace = true

[lints]
workspace = true
