name: ci

on:
  pull_request:
  push:
    branches: [main, unify/base]

jobs:
  # Runs on every change: SdkSourcesSuite (models-gen) fails if the generated SDK models are stale.
  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # the crypto module bundles sdk/rust/jvm-ffi, which sbt builds with cargo (project/JvmFfi.scala): the toolchain
      # sdk/rust/rust-toolchain.toml pins, as the rust job installs it
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      # clean first: the sbt-scalafmt incremental cache can report false passes
      - run: sbt clean checkPR test

  changes:
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's changed files through the API
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      sp1: ${{ steps.filter.outputs.sp1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'sdk/ts/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'sdk/rust/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            # the guest links core, proofs, signing and jlvm, so any of them (or the vectors) reruns it
            sp1:
              - 'sdk/rust/**'
              - 'shared/vectors/**'
              - '.github/workflows/ci.yml'

  typescript:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      # pinned: clippy pedantic is denied, so a new stable's lints must not break CI unannounced. The same version as
      # sdk/rust/rust-toolchain.toml; move both together
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          # SP1 v6 guests build for riscv64im-succinct-zkvm-elf with atomics lowered (-Cpasses=lower-atomic), a target
          # rustup does not ship. riscv64imac-unknown-none-elf stands in: 64-bit, no std, atomic CAS available. It does not
          # compile the SP1 patches' target_os = "zkvm" paths (their precompile calls): only an SP1 guest build does
          targets: riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # verification alone, as an SP1 guest builds it
      - run: cargo clippy -p dilf4s-signing --no-default-features --all-targets -- -D warnings
      - run: cargo test -p dilf4s-signing --no-default-features
      - run: cargo build -p dilf4s-core --release --target riscv64imac-unknown-none-elf
      - run: cargo build -p dilf4s-proofs --release --target riscv64imac-unknown-none-elf
      - run: cargo build -p dilf4s-jlvm --release --target riscv64imac-unknown-none-elf
      # the verifier-only build an SP1 guest uses, and the full one
      - run: cargo build -p dilf4s-signing --no-default-features --release --target riscv64imac-unknown-none-elf
      - run: cargo build -p dilf4s-signing --release --target riscv64imac-unknown-none-elf

  # A real SP1 v6 guest (riscv64im-succinct-zkvm-elf) with every SP1 patch, so the patches' target_os = "zkvm" paths
  # are compiled and run. Execute mode only: nothing is proved. sdk/rust/zk/README.md says what each patch changes.
  sp1-guest:
    needs: changes
    if: needs.changes.outputs.sp1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sdk/rust/zk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      # sp1-sdk's build compiles protobuf definitions that import google/protobuf/empty.proto
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # sp1up at the v6.10.0 commit (a SHA, as tags can move), installing cargo-prove v6.10.0, which installs its pinned
      # succinct toolchain; check-toolchain.sh then checks both
      - name: Install the SP1 toolchain v6.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/succinctlabs/sp1/d83ed91f96701209613720708f36ffce0e98ed33/sp1up/sp1up -o "$RUNNER_TEMP/sp1up"
          SP1_DIR="$HOME/.sp1" bash "$RUNNER_TEMP/sp1up" --version v6.10.0 --token "$GITHUB_TOKEN"
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - run: ./check-toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sdk/rust/zk/cases
            sdk/rust/zk/host
            sdk/rust/zk/guest
      - run: cargo fmt --check --manifest-path cases/Cargo.toml
      - run: cargo fmt --check --manifest-path guest/Cargo.toml
      - run: cargo fmt --check --manifest-path host/Cargo.toml
      - run: cargo clippy --locked --manifest-path cases/Cargo.toml --all-targets --all-features -- -D warnings
      # host/build.rs refuses a stale guest/Cargo.lock, then builds the guest with the succinct toolchain, --locked
      - run: cargo test --locked --release --manifest-path host/Cargo.toml -- --nocapture
      # after the tests: under clippy, sp1-build skips the guest build, and the host includes the guest's ELF
      - run: cargo clippy --locked --manifest-path host/Cargo.toml --all-targets -- -D warnings
      # no lockfile may change while checking
      - run: git diff --exit-code -- '*.lock'
