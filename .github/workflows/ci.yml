name: ci

on:
  pull_request:
  push:
    branches: [main, unify/base]

jobs:
  # Runs on every change: SdkSourcesSuite and GoEmitterSuite (models-gen) fail if the generated SDK models are stale.
  scala:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: python3 tools/gas/ratios.py --selftest
      # clean first: the sbt-scalafmt incremental cache can report false passes. The same run prints the JLVM's test
      # classpath, which the difffuzz job runs on
      - run: |
          set -o pipefail
          tools/sbt clean checkPR test "export jlvm/Test/fullClasspath" | tee "$RUNNER_TEMP/sbt.log"
      - if: needs.changes.outputs.jlvm == 'true'
        run: |
          set -o pipefail
          grep -m 1 -E '^/.*/jlvm/target/scala-[^/]+/test-classes' "$RUNNER_TEMP/sbt.log" | tools/difffuzz/bundle.sh target/difffuzz-bundle
      - if: needs.changes.outputs.jlvm == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: difffuzz-scala
          path: target/difffuzz-bundle
          retention-days: 1

  changes:
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's changed files through the API
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      sp1: ${{ steps.filter.outputs.sp1 }}
      go: ${{ steps.filter.outputs.go }}
      jlvm: ${{ steps.filter.outputs.jlvm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'lang/ts/**'
              - 'tools/mcp/**'
              - 'package.json'
              - 'package-lock.json'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'lang/rust/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            # the bindings build lang/rust's crates, and the tests run every shared vector through them
            python:
              - 'lang/python/**'
              - 'lang/rust/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            # the guest links core, proofs, signing and jlvm, so any of them (or the vectors) reruns it
            sp1:
              - 'lang/rust/**'
              - 'shared/vectors/**'
              - '.github/workflows/ci.yml'
            # the Go models are generated by models-gen (the scala job checks they are current)
            go:
              - 'lang/go/**'
              - 'shared/**'
              - 'lang/scala/models-gen/**'
              - '.github/workflows/ci.yml'

            # a JLVM in any language, what each is built on, the vectors and the harness: these run the difffuzz job,
            # and with it the Rust and TypeScript jobs that build its runners
            jlvm:
              - 'lang/scala/storage/**'
              - 'lang/scala/models-gen/**'
              - 'lang/scala/jlvm/**'
              - 'lang/scala/core/**'
              - 'lang/scala/numerics/**'
              - 'lang/scala/crypto/**'
              - 'lang/scala/accumulators/**'
              - 'lang/scala/circe-interop/**'
              - 'lang/scala/shared-test/**'
              - 'lang/scala/build.sbt'
              - 'lang/scala/project/**'
              - 'vendor/**'
              - 'lang/rust/native/Cargo.*'
              - 'lang/rust/rust-toolchain.toml'
              - 'lang/rust/core/**'
              - 'lang/rust/signing/**'
              - 'lang/rust/proofs/**'
              - 'lang/rust/jlvm/**'
              - 'lang/rust/difffuzz/**'
              - 'lang/ts/package*.json'
              - 'lang/ts/packages/core/**'
              - 'lang/ts/packages/signing/**'
              - 'lang/ts/packages/proofs/**'
              - 'lang/ts/packages/jlvm/**'
              - 'shared/**'
              - 'tools/difffuzz/**'
              - 'tools/sbt'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lang/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: lang/go/go.mod
          cache-dependency-path: lang/go/go.sum
      # pinned, as clippy is: a new release's checks must not break CI unannounced
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: go mod verify
      - run: go vet ./...
      - run: staticcheck ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      # no unsafe, reflect, cgo, panic, recover, goroutine or package-level variable in library code
      - run: ./scripts/forbidden.sh
      - run: CGO_ENABLED=0 go test ./...
      # the libraries' assembly-free paths, and a 32-bit int
      - run: CGO_ENABLED=0 go test -tags purego ./...
      - run: GOARCH=386 CGO_ENABLED=0 go test ./...
      # the race detector needs cgo; the library never does
      - run: CGO_ENABLED=1 go test -race ./...
      # every Fuzz target (one per decoder: CBOR, JSON, every generated model) for 20 s, seeded from the shared vectors;
      # a failure leaves its input under the package's testdata/fuzz, which the log names
      - run: ./scripts/fuzz-smoke.sh
      # no file may change while checking: go.mod and go.sum are tidy, and nothing above writes to the tree
      - run: go mod tidy && git diff --exit-code -- .

  typescript:
    needs: changes
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.jlvm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lang/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ../..
      - run: npm run lint && npm run lint --workspace @kd5ujc/dilf4s-mcp
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm run build --workspace @kd5ujc/dilf4s-mcp
      # the difffuzz job's TypeScript runner runs on these
      - if: needs.changes.outputs.jlvm == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: difffuzz-ts
          path: lang/ts/packages/*/dist
          retention-days: 1

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.jlvm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lang/rust/native
    steps:
      - uses: actions/checkout@v4
      # pinned: clippy pedantic is denied, so a new stable's lints must not break CI unannounced. The same version as
      # lang/rust/rust-toolchain.toml; move both together
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          # SP1 v6 guests build for riscv64im-succinct-zkvm-elf with atomics lowered (-Cpasses=lower-atomic), a target
          # rustup does not ship. riscv64imac-unknown-none-elf stands in: 64-bit, no std, atomic CAS available. It does not
          # compile the SP1 patches' target_os = "zkvm" paths (their precompile calls): only an SP1 guest build does
          targets: riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lang/rust/native
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # verification alone, as an SP1 guest builds it
      - run: cargo clippy -p dilf4s-signing --no-default-features --all-targets -- -D warnings
      - run: cargo test -p dilf4s-signing --no-default-features
      - run: cargo build -p dilf4s-core --release --target riscv64imac-unknown-none-elf
      - run: cargo build -p dilf4s-proofs --release --target riscv64imac-unknown-none-elf
      - run: cargo build -p dilf4s-jlvm --release --target riscv64imac-unknown-none-elf
      # the verifier-only build an SP1 guest uses, and the full one
      - run: cargo build -p dilf4s-signing --no-default-features --release --target riscv64imac-unknown-none-elf
      - run: cargo build -p dilf4s-signing --release --target riscv64imac-unknown-none-elf
      # the difffuzz job's Rust runner
      - if: needs.changes.outputs.jlvm == 'true'
        run: cargo build -p dilf4s-difffuzz --release
      - if: needs.changes.outputs.jlvm == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: difffuzz-rust
          path: lang/rust/native/target/release/dilf4s-difffuzz
          retention-days: 1

  # Differential fuzzing of the three JLVMs (tools/difffuzz/README.md), on what the three jobs above built: the Scala
  # classpath, the Rust runner and the TypeScript packages, so nothing is compiled twice. First every jlvm_v1.json case,
  # each record checked against its row; then a fixed seed and count, capped at five minutes
  difffuzz:
    needs: [changes, scala, rust, typescript]
    if: ${{ !cancelled() && needs.changes.outputs.jlvm == 'true' && needs.scala.result == 'success' && needs.rust.result == 'success' && needs.typescript.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ../..
        working-directory: lang/ts
      - uses: actions/download-artifact@v4
        with:
          name: difffuzz-scala
          path: target/difffuzz-bundle
      - uses: actions/download-artifact@v4
        with:
          name: difffuzz-rust
          path: lang/rust/native/target/release
      - uses: actions/download-artifact@v4
        with:
          name: difffuzz-ts
          path: lang/ts/packages
      # artifacts do not keep file modes
      - run: chmod +x lang/rust/native/target/release/dilf4s-difffuzz
      - run: DIFFFUZZ_PREBUILT=1 tools/difffuzz/run.sh --vectors --out target/difffuzz/vectors
      - run: DIFFFUZZ_PREBUILT=1 tools/difffuzz/run.sh --seed 1 --cases 60000 --minutes 5 --shrink-budget 1500 --out target/difffuzz/seeded
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: difffuzz-findings
          path: target/difffuzz

  # Kani, the Rust model checker (lang/rust/verify/src/proofs.rs): each harness proves its property on every input it
  # covers, with no panic, overflow or out-of-bounds access on the way. All of them, measured on euler one at a time
  # under a 12 GB cap: a few minutes, under 4 GB each. They cover what Kani can take; proofs.rs says what it cannot
  kani:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lang/rust/native
    steps:
      - uses: actions/checkout@v4
      # cargo here resolves through rustup to lang/rust/rust-toolchain.toml's version; Kani builds with its own nightly
      - uses: dtolnay/rust-toolchain@1.99.1
      # Kani 0.68.0: cargo-kani, its bundle (CBMC and the Kani compiler) and the nightly it pins
      - id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani/kani-0.68.0
            ~/.rustup/toolchains/nightly-2026-08-21-x86_64-unknown-linux-gnu
          key: kani-0.68.0-nightly-2026-08-21-${{ runner.os }}
      - if: steps.kani-cache.outputs.cache-hit != 'true'
        run: cargo install --locked kani-verifier --version 0.68.0 && cargo kani setup
      - run: cargo kani -p dilf4s-verify

  # The Python SDK (lang/python): PyO3 bindings over lang/rust, in their own cargo workspace and lockfile. One abi3 wheel
  # serves CPython 3.12 on; it is installed and tested on the oldest and newest supported Pythons, every shared vector
  # through its API. The tools are pinned by uv.lock.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: lang/python
    steps:
      - uses: actions/checkout@v4
      # the same pin as the rust job's and lang/python/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lang/python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.11"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --lib
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --no-sync maturin build --release --locked --out dist
      # the wheel, not the source tree, is what the tests import
      - run: uv pip install --no-deps dist/*.whl
      - run: uv run --no-sync ruff check python tests tools
      - run: uv run --no-sync ruff format --check python tests tools
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python -m mypy.stubtest dilf4s._native --allowlist stubtest-allowlist.txt
      - run: uv run --no-sync pytest
      # no lockfile may change while checking
      - run: git diff --exit-code -- '*.lock'

  # A real SP1 v6 guest (riscv64im-succinct-zkvm-elf) with every SP1 patch, so the patches' target_os = "zkvm" paths
  # are compiled and run. Execute mode only: nothing is proved. lang/rust/zk/README.md says what each patch changes.
  sp1-guest:
    needs: changes
    if: needs.changes.outputs.sp1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lang/rust/zk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      # sp1-sdk's build compiles protobuf definitions that import google/protobuf/empty.proto
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # sp1up at the v6.10.0 commit (a SHA, as tags can move), installing cargo-prove v6.10.0, which installs its pinned
      # succinct toolchain; check-toolchain.sh then checks both
      - name: Install the SP1 toolchain v6.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/succinctlabs/sp1/d83ed91f96701209613720708f36ffce0e98ed33/sp1up/sp1up -o "$RUNNER_TEMP/sp1up"
          SP1_DIR="$HOME/.sp1" bash "$RUNNER_TEMP/sp1up" --version v6.10.0 --token "$GITHUB_TOKEN"
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - run: ./check-toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          # the guest's workspace root is lang/rust/, so its target directory is lang/rust/target
          workspaces: |
            lang/rust/zk/cases
            lang/rust/zk/host
            lang/rust
      - run: cargo fmt --check --manifest-path cases/Cargo.toml
      - run: cargo fmt --check --manifest-path guest/Cargo.toml
      - run: cargo fmt --check --manifest-path host/Cargo.toml
      - run: cargo clippy --locked --manifest-path cases/Cargo.toml --all-targets --all-features -- -D warnings
      # host/build.rs refuses a stale lang/rust/Cargo.lock, then builds the guest with the succinct toolchain, --locked
      # one family at a time: each test runs SP1's native executor in a child process backed by /dev/shm,
      # which parallel tests can fill: SP1 reports that as a SIGBUS crash ("CrashDetails { signal: 7 }")
      - run: df -h /dev/shm
      - run: cargo test --locked --release --manifest-path host/Cargo.toml -- --nocapture --test-threads=1
      # after the tests: under clippy, sp1-build skips the guest build, and the host includes the guest's ELF. The
      # tests include tests/jlvm_call.rs: the JLVM call guest against native code, and shared/vectors/zk_jlvm_v1.json
      # current with the guest's verifying key (a changed guest fails until the file is regenerated)
      - run: cargo clippy --locked --manifest-path host/Cargo.toml --all-targets -- -D warnings
      # the prove path's CUDA prover compiles (sp1-cuda needs no CUDA toolkit to build); nothing is proved here
      - run: cargo clippy --locked --manifest-path host/Cargo.toml --all-targets --features cuda -- -D warnings
      # no lockfile may change while checking
      - run: git diff --exit-code -- '*.lock'
