# core's main sources: everything in .scalafix.conf, and no hashed collection. Canonical maps hold caller-chosen keys,
# and Java's String.hashCode is trivially collidable, so a hashed structure on them degrades to linear scans: keys are
# compared (TreeMap / TreeSet in a KeyOrder), never hashed.
include ".scalafix.conf"

DisableSyntax.regex = ${DisableSyntax.regex} [
  {
    id = "noHashedCollection"
    pattern = "Hash(Map|Set)\\b|\\b(VectorMap|ListMap|ListSet|SeqMap|AnyRefMap|LongMap|TrieMap)\\b"
    message = "core holds no hashed collection: use TreeMap / TreeSet in a KeyOrder, so keys are compared, never hashed"
  }
  {
    id = "noMutableCollection"
    pattern = "\\bmutable\\."
    message = "core holds no mutable collection: use an immutable TreeMap / TreeSet in a KeyOrder"
  }
  {
    id = "noHashingConversion"
    pattern = "\\.(toMap|toSet|distinctBy|distinct|groupMapReduce|groupMap|groupBy|diff|intersect)\\b"
    message = "this builds a hashed collection: build a TreeMap / TreeSet in a KeyOrder, or sort and compare neighbours"
  }
  {
    id = "noHashedFactory"
    pattern = "\\b(Map|Set)\\s*[(.)]"
    message = "Map(...) and Set(...) build hashed collections: use TreeMap / TreeSet in a KeyOrder, or a match on a fixed table"
  }
]
