# core's main sources: everything in .scalafix.conf, and no hashing. Canonical maps hold caller-chosen keys, and Java's
# String.hashCode is trivially collidable, so a hashed structure on them degrades to linear scans: keys are compared
# (CanonicalEntries / CanonicalKeys, or a TreeMap / TreeSet in a KeyOrder), never hashed. The rules match words, not
# call shapes, so a typed factory (Map[K, V](...)) or an infix call (xs distinctBy f) is caught as surely as xs.toMap.
include ".scalafix.conf"

DisableSyntax.regex = ${DisableSyntax.regex} [
  {
    id = "noHashedCollection"
    pattern = "Hash(Map|Set)\\b|\\b(VectorMap|ListMap|ListSet|SeqMap|AnyRefMap|LongMap|IntMap|TrieMap)\\b"
    message = "core holds no hashed collection: use CanonicalEntries / CanonicalKeys, or a TreeMap / TreeSet in a KeyOrder"
  }
  {
    id = "noJavaCollection"
    pattern = "\\bjava\\s*\\.\\s*util\\b|\\b(Hashtable|Properties|Dictionary|IdentityHashMap|WeakHashMap|EnumMap|asJava|asScala|CollectionConverters|JavaConverters)\\b"
    message = "core uses no Java collection (Hashtable, Properties and the rest hash, outside Scala's own checks): use CanonicalEntries / CanonicalKeys, or a TreeMap / TreeSet in a KeyOrder"
  }
  {
    id = "noMutableCollection"
    pattern = "\\bmutable\\s*\\."
    message = "core holds no mutable collection: use an immutable TreeMap / TreeSet in a KeyOrder"
  }
  {
    id = "noMapOrSet"
    pattern = "\\b(Map|Set)\\b"
    message = "core never names Map or Set, whose factories and conversions hash: use CanonicalEntries / CanonicalKeys, a TreeMap / TreeSet in a KeyOrder, or Iterable for a fixed list"
  }
  {
    id = "noHashingConversion"
    pattern = "\\b(toMap|toSet|distinctBy|distinct|groupMapReduce|groupMap|groupBy)\\b|(?<!def )\\b(diff|intersect)\\b"
    message = "this hashes its elements: build a TreeMap / TreeSet in a KeyOrder, or sort and compare neighbours"
  }
  {
    id = "noHashCode"
    pattern = "\\bhashCode\\b|##"
    message = "core never hashes: compare through a KeyOrder instead"
  }
]
