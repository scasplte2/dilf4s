# core's main sources: everything in .scalafix.conf, and no hashing. Canonical maps hold caller-chosen keys, and Java's
# String.hashCode is trivially collidable, so a hashed structure on them degrades to linear scans: keys are compared
# (CanonicalEntries / CanonicalKeys, or a TreeMap / TreeSet in a KeyOrder), never hashed. NoHashing
# (scalafix-rules/rules) checks the types and symbols the compiler resolved, not the words written; its fixtures
# (scalafix-rules/input) are every bypass found, run by the scalafix-rules/tests suite in the gate.
include ".scalafix.conf"

rules = ${rules} [NoHashing]
