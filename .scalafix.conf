rules = [
  OrganizeImports
  ExplicitResultTypes
  ProcedureSyntax
  DisableSyntax
]

OrganizeImports {
  groupedImports                    = Merge
  coalesceToWildcardImportThreshold = 8
  groups                            = ["re:javax?\\.", "cats.", "scala.", "xyz.kd5ujc.", "*"]
  removeUnused                      = true
}

DisableSyntax {
  noVars        = true
  noThrows      = true
  noNulls       = true
  noReturns     = true
  noWhileLoops  = true
  noFinalize    = true
  noValPatterns = true
  noXml         = true
  regex = [
    { id = "noTry", pattern = "\\btry\\b", message = "try is not allowed; capture failures with Either.catchNonFatal / Sync[F].delay + Raise" }
    { id = "noCatch", pattern = "\\bcatch\\b", message = "catch is not allowed; handle errors with Handle / handleErrorWith" }
    { id = "noFinally", pattern = "\\bfinally\\b", message = "finally is not allowed; use Resource or guarantee" }
  ]
}
