# The SP1 guest's workspace (sdk/rust/zk/guest), and nothing else: sdk/rust and sdk/rust/zk/{cases,host} are their
# own roots. The root is here, above every path dependency of the guest, so cargo hashes those by their paths relative
# to it: the guest's ELF, and so the JLVM call's verifying key pinned in shared/vectors/zk_jlvm_v1.json, are then the
# same wherever the repository is checked out (sdk/rust/zk/README.md). Its patches reach only the guest: the host's
# native side builds the crates.io releases.
[workspace]
members = ["rust/zk/guest"]
exclude = ["rust"]
resolver = "3"

# Every SP1 v6.10.0 patch of a crate in the graph (README.md lists them and what each changes). The host test checks
# sdk/Cargo.lock resolves each of these crates to its patch and nothing else. bls12_381 is not here: dilf4s-signing
# depends on its patched source directly, at the same tag. The ecdsa fork comes in through the k256 patch.
[patch.crates-io]
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.10.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.10.0" }
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.10.0" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.10.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-6.10.0" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.10.0-substrate-bn" }
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.10.0" }
