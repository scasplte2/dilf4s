# The Python SDK's native module: PyO3 bindings over the Rust SDK (sdk/rust/{core,signing,proofs,jlvm}), built by
# maturin into the `dilf4s._native` extension of the `dilf4s` package (pyproject.toml).
#
# Its own workspace and lockfile, so neither sdk/rust/Cargo.lock nor sdk/Cargo.lock (the SP1 guest's, whose paths fix
# the guest's verifying key) changes. Cargo.lock started as a copy of sdk/rust/Cargo.lock, and tests/test_lockfile.py
# checks every crate the two share resolves to the same version, so the bindings run the code the Rust SDK tests.
[workspace]

[package]
name = "dilf4s-python"
description = "PyO3 bindings over the dilf4s Rust SDK: the dilf4s Python package's native module"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
dilf4s-core = { path = "../rust/core" }
dilf4s-jlvm = { path = "../rust/jlvm" }
dilf4s-proofs = { path = "../rust/proofs" }
dilf4s-signing = { path = "../rust/signing" }
# The stable ABI from Python 3.12: one wheel per platform for every CPython from 3.12 on
pyo3 = { version = "=0.30.1", default-features = false, features = ["macros", "abi3-py312"] }
# NFKD, exactly as dilf4s-signing normalises BIP-39 words (the same crate and version, unified by the lockfile), so a
# word list's duplicates are refused before any word is copied
unicode-normalization = { version = "0.1", default-features = false }

# sdk/rust's lints, as strict
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
arithmetic_side_effects = "deny"
as_conversions = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"

[profile.release]
# a panic in the bindings would become a Python exception (PyO3 catches it at the boundary): never abort the process
panic = "unwind"
