[package]
name = "dilf4s-jvm-ffi"
description = "The JVM's native Ed25519 verification: a C ABI over dilf4s-signing, loaded by the Scala crypto module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# verification only
dilf4s-signing = { path = "../signing", default-features = false }

[dev-dependencies]
dilf4s-core = { path = "../core" }
dilf4s-signing = { path = "../signing" }

# The workspace's table, except `unsafe_code`: `forbid` there cannot be lifted, and the C ABI needs `unsafe`. Here it
# is `deny`, allowed for the one `ffi` module, where every unsafe block carries its own `// SAFETY:` comment. A test
# (`lints_follow_the_workspace`) keeps the rest of this table equal to the workspace's.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
arithmetic_side_effects = "deny"
as_conversions = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
# this crate's own: the unsafe code says why each operation is sound, one operation per block
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
