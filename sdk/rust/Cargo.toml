[workspace]
resolver = "3"
members = ["core", "fixtures", "proofs", "signing"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

# Pure Rust only: every crate here builds for no_std + alloc targets such as SP1's RISC-V guest.
[workspace.dependencies]
blake2 = { version = "0.11", default-features = false }
num-bigint = { version = "0.5", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.12", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
arithmetic_side_effects = "deny"
as_conversions = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
