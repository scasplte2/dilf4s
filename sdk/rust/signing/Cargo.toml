[package]
name = "dilf4s-signing"
description = "dilf4s signatures, key derivation, VRFs and key-evolving signatures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sign"]
# Signing, proving and key derivation. Verification never needs it, so a verifier-only build (an SP1 guest) leaves
# it off.
sign = ["dep:hkdf", "dep:hmac", "dep:pbkdf2", "dep:unicode-normalization", "dep:rand_core"]

[dependencies]
dilf4s-core = { path = "../core" }
# SP1's patch of 0.8.0 moved hashing to digest 0.10, so it differs from crates.io 0.8.0 (digest 0.9): depend on the
# patched source itself, which builds as plain Rust off the zkVM, so native code and the guest compile the same crate.
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0", default-features = false, features = ["groups", "pairings", "alloc", "experimental", "zeroize"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "zeroize", "digest"] }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "ecdsa", "schnorr", "alloc"] }
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic", "ecdsa", "alloc"] }
sha2.workspace = true
blake2.workspace = true
# GF(2^255 - 19) for the VRF Elligator maps (draft-03 and RFC 9380), which curve25519-dalek keeps private: the formally
# verified field curve25519-dalek's own `fiat` backend uses, at the version it resolves to
fiat-crypto = { version = "=0.2.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "1.9", default-features = false, features = ["alloc", "zeroize_derive"] }
hkdf = { version = "0.12", default-features = false, optional = true }
hmac = { version = "0.12", optional = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }
unicode-normalization = { version = "0.1", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
# An independent RFC 8032 implementation to cross-check signing and the strict/ZIP-215 difference
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# Big-integer test helpers, and the VRF field's previous BigUint implementation, kept as its reference
num-bigint.workspace = true

# The workspace's lints, but `unsafe_code` is "deny", not "forbid": the one module that calls SP1's `sys_bigint`
# (`src/vrf/field/zkvm.rs`, compiled only for SP1's guest, issue #69) allows it, which a forbid from Cargo would
# refuse. Cargo cannot override one inherited lint, so the table is a copy, and `tests/lints.rs` fails if it drifts
# from the workspace's. `src/lib.rs` still forbids unsafe code on every target but SP1's guest.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
# SP1's guest target (riscv64im-succinct-zkvm-elf), which code specific to SP1's patches and syscalls is gated on
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("succinct"))'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
arithmetic_side_effects = "deny"
as_conversions = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
