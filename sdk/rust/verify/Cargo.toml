[package]
name = "dilf4s-verify"
description = "Properties of the dilf4s decoders, parsers and gas arithmetic, and Kani proofs that they hold on every input up to a bound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only the public APIs: the SP1 guest links core and jlvm, so nothing here may change their sources (sdk/rust/zk).
# `cargo kani` supplies the `kani` crate and cfg(kani) itself.
[dependencies]
dilf4s-core = { path = "../core" }
dilf4s-jlvm = { path = "../jlvm" }

[lints]
workspace = true
